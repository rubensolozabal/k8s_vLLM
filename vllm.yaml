apiVersion: v1
kind: Namespace
metadata:
  name: ai-stack
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: ai-stack
type: Opaque
stringData:
  HF_TOKEN: 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
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-stack
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      nodeSelector:
        accelerator: nvidia
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - vllm
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3-4B-Instruct-2507
            - --host=0.0.0.0
            - --port=8000
            - --dtype=auto
            - --gpu-memory-utilization=0.90
            - --max-model-len=4096
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai-stack
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm
  namespace: ai-stack
spec:
  ingressClassName: nginx
  rules:
    - host: llm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm
                port:
                  number: 80

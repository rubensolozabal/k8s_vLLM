[project]
name = "client"
version = "0.1.0"
description = "LLM client"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "langchain>=1.0.8",
    "langchain-openai>=1.0.3",
    "mlflow>=3.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.5",
    "jupyterlab>=4.5.0",
    "ipywidgets>=8.1.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.setuptools]
packages = ["client"]
